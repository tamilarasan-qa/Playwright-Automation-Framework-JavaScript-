
name: Playwright Automation Tests

on:
  push:
    branches: [main, master, feature]

  pull_request:
    branches: [main, master]

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT REPOSITORY
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v6


      # ============================================================
      # 2. SETUP NODE.JS
      # ============================================================

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm


      # ============================================================
      # 3. INSTALL DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        run: npm ci


      # ============================================================
      # 4. INSTALL PLAYWRIGHT BROWSERS
      # ============================================================

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # ============================================================
      # 5. RUN ORANGEHRM TESTS
      # ============================================================

      - name: Run Orangehrm tests
        if: ${{ always() && !cancelled() }}
        run: |
          npx playwright test tests/orangehrm/

      # ============================================================
      # 6. RUN SAUCEDEMO TESTS
      # ============================================================

      - name: Run SauceDemo tests
        if: ${{ always() && !cancelled() }}
        run: |
          npx playwright test tests/saucedemo/

      # ============================================================
      # 7. UPLOAD PLAYWRIGHT REPORT
      # ============================================================

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
